<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For You, Bebe 💕</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    /* ─── CSS Variables ─── */
    :root {
      --pink-lightest: #fff0f5;
      --pink-light:    #ffd6e7;
      --pink-mid:      #ffb3cc;
      --pink-hot:      #ff6fa8;
      --pink-deep:     #e0457b;
      --pink-text:     #8b2252;
      --pink-soft:     #ffecf2;
      --white:         #fffbfd;
      --shadow:        rgba(224, 69, 123, 0.18);
      --shadow-strong: rgba(224, 69, 123, 0.35);
    }

    /* ─── Reset & Base ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Lato', sans-serif;
      background: linear-gradient(160deg, #fff0f5 0%, #ffd6e7 40%, #ffb3cc 100%);
      min-height: 100vh;
      color: var(--pink-text);
      overflow-x: hidden;
      position: relative;
    }

    /* ─── Floating Hearts Canvas ─── */
    #hearts-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* ─── Main Container ─── */
    .container {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: 40px 24px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    /* ─── Music Button ─── */
    #music-btn {
      position: fixed;
      top: 16px; right: 16px;
      z-index: 100;
      background: white;
      border: 2px solid var(--pink-mid);
      color: var(--pink-deep);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 16px var(--shadow);
      transition: all 0.3s ease;
      white-space: nowrap;
    }
    #music-btn:hover { background: var(--pink-light); transform: scale(1.05); }
    #music-btn.playing { background: var(--pink-hot); color: white; border-color: var(--pink-hot); }

    /* ─── Crown emoji ─── */
    .crown-icon {
      font-size: 48px;
      animation: crown-float 3s ease-in-out infinite;
      filter: drop-shadow(0 4px 12px rgba(255,111,168,0.4));
    }
    @keyframes crown-float {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50%       { transform: translateY(-10px) rotate(4deg); }
    }

    /* ─── Greeting Card ─── */
    .greeting-card {
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255,179,204,0.6);
      border-radius: 28px;
      padding: 32px 28px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px var(--shadow);
      opacity: 0;
      transform: translateY(24px);
      animation: slide-up 0.9s ease 0.3s forwards;
    }

    .greeting-main {
      font-family: 'Playfair Display', serif;
      font-size: clamp(22px, 6vw, 28px);
      font-weight: 700;
      color: var(--pink-deep);
      line-height: 1.3;
      margin-bottom: 10px;
    }

    .greeting-sub {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(15px, 4vw, 18px);
      color: var(--pink-hot);
      margin-bottom: 14px;
    }

    .greeting-tease {
      font-size: 14px;
      color: #c05a85;
      line-height: 1.6;
      font-weight: 300;
    }

    /* ─── Divider ─── */
    .divider {
      width: 60px;
      height: 3px;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--pink-mid), var(--pink-hot));
      margin: 6px auto 0;
    }

    /* ─── Cuddle Line ─── */
    .cuddle-line {
      background: rgba(255,255,255,0.6);
      border-left: 4px solid var(--pink-hot);
      border-radius: 0 16px 16px 0;
      padding: 12px 18px;
      width: 100%;
      font-style: italic;
      font-size: 14.5px;
      color: #b84a72;
      opacity: 0;
      animation: slide-up 0.8s ease 1.2s forwards;
    }

    /* ─── Buttons ─── */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      opacity: 0;
      animation: slide-up 0.8s ease 1.6s forwards;
    }

    .btn {
      width: 100%;
      padding: 18px 24px;
      border: none;
      border-radius: 20px;
      font-family: 'Lato', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 6px 20px var(--shadow);
      letter-spacing: 0.2px;
    }

    .btn-yes {
      background: linear-gradient(135deg, var(--pink-hot) 0%, var(--pink-deep) 100%);
      color: white;
    }
    .btn-yes:hover, .btn-yes:active {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 12px 30px var(--shadow-strong);
    }

    .btn-wait {
      background: rgba(255,255,255,0.8);
      color: var(--pink-deep);
      border: 2px solid var(--pink-mid);
    }
    .btn-wait:hover, .btn-wait:active {
      background: var(--pink-light);
      transform: translateY(-2px);
    }

    /* ─── Response Card ─── */
    .response-card {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255,179,204,0.5);
      border-radius: 24px;
      padding: 26px 24px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 28px var(--shadow);
      display: none;
      opacity: 0;
    }
    .response-card.visible {
      display: block;
      animation: pop-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    .response-emoji {
      font-size: 40px;
      display: block;
      margin-bottom: 12px;
    }
    .response-text {
      font-family: 'Playfair Display', serif;
      font-size: clamp(16px, 4.5vw, 20px);
      color: var(--pink-deep);
      line-height: 1.55;
    }

    /* ─── Surprise Message ─── */
    .surprise-card {
      background: linear-gradient(135deg, rgba(255,214,231,0.9), rgba(255,255,255,0.9));
      border: 1.5px solid var(--pink-light);
      border-radius: 24px;
      padding: 22px 20px;
      width: 100%;
      text-align: center;
      box-shadow: 0 6px 24px var(--shadow);
      opacity: 0;
      transform: scale(0.92);
      transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .surprise-card.visible {
      opacity: 1;
      transform: scale(1);
    }
    .surprise-text {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(15px, 4vw, 18px);
      color: var(--pink-deep);
    }

    /* ─── Footer ─── */
    .footer {
      text-align: center;
      font-size: 12.5px;
      color: #c079a0;
      opacity: 0;
      animation: slide-up 0.8s ease 2.2s forwards;
      line-height: 1.8;
    }

    /* ─── Glow Pulse on YES ─── */
    body.glow::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255,111,168,0.25), transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: glow-pulse 1.2s ease forwards;
    }
    @keyframes glow-pulse {
      0%   { opacity: 0; }
      40%  { opacity: 1; }
      100% { opacity: 0; }
    }

    /* ─── Keyframes ─── */
    @keyframes slide-up {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pop-in {
      from { opacity: 0; transform: scale(0.88); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* ─── Typewriter cursor ─── */
    .cursor {
      display: inline-block;
      width: 2px;
      background: var(--pink-hot);
      animation: blink 0.8s step-end infinite;
      vertical-align: middle;
      height: 1.1em;
      margin-left: 2px;
      border-radius: 1px;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ─── Scrollbar ─── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--pink-lightest); }
    ::-webkit-scrollbar-thumb { background: var(--pink-mid); border-radius: 99px; }
  </style>
</head>
<body>

<!-- Hearts background -->
<canvas id="hearts-canvas"></canvas>

<!-- Hidden audio -->
<audio id="bg-music" loop>
  <!-- User should replace this src with an actual audio file path or hosted URL -->
  <source src="love-kendrick.mp3" type="audio/mpeg" />
</audio>

<!-- Music toggle button -->
<button id="music-btn" onclick="toggleMusic()">🎵 Tap to play music</button>

<div class="container">

  <!-- Crown -->
  <div class="crown-icon">👑</div>

  <!-- Greeting Card with typewriter -->
  <div class="greeting-card">
    <p class="greeting-main" id="greeting-main"></p>
    <p class="greeting-sub" id="greeting-sub" style="opacity:0;transition:opacity 0.6s ease;"></p>
    <div class="divider"></div>
    <p class="greeting-tease" id="greeting-tease" style="opacity:0;transition:opacity 0.6s ease;margin-top:14px;"></p>
  </div>

  <!-- Cuddle line -->
  <div class="cuddle-line">
    💭 &ldquo;I was just thinking about our cuddles…&rdquo;
  </div>

  <!-- Buttons -->
  <div class="btn-group">
    <button class="btn btn-yes" onclick="handleYes()">Will you be mine? ❤️</button>
    <button class="btn btn-wait" onclick="handleWait()">Or should I wait for your earliest convenience? 😌</button>
  </div>

  <!-- Response Card (hidden by default) -->
  <div class="response-card" id="response-card">
    <span class="response-emoji" id="response-emoji"></span>
    <p class="response-text" id="response-text"></p>
  </div>

  <!-- Surprise message (appears after delay) -->
  <div class="surprise-card" id="surprise-card">
    <p style="font-size:22px;margin-bottom:8px;">💌</p>
    <p class="surprise-text">&ldquo;I appreciate you more than I say ❤️&rdquo;</p>
  </div>

  <!-- Footer -->
  <div class="footer">
    Made with every ounce of love<br/>
    just for <strong>Sandra Shida Kemmy</strong> 💕<br/>
    aka my bebe… my Amor 🌸
  </div>

</div>

<script>
  /* ─── Personalization ─── */
  const name = "Sandra Shida Kemmy";

  /* ─── Responses ─── */
  const yesResponses = [
    { emoji: "🥹❤️", text: "You just made me the happiest person alive ❤️\nI love you so much, bebe." },
    { emoji: "😌💕", text: "Come here, I need more cuddles immediately 😌\nLike right now. No debates." },
    { emoji: "😏🌸", text: "I knew you were mine already…\nI just wanted to hear you say it 😏" },
    { emoji: "👑❤️", text: "Of course. Because queens always choose right 👑\nAnd bebe… you chose me." },
  ];

  const waitResponses = [
    { emoji: "😌", text: "I'll be right here…\npatiently waiting 😌\n(but not too patiently)" },
    { emoji: "😭💕", text: "But just know I prefer cuddles over waiting 😭\nHurry back to me." },
    { emoji: "👑", text: "Don't take too long, my Queen 👑\nI miss you already." },
    { emoji: "🙃", text: "Fine. I'll just sit here thinking about you\nuntil your earliest convenience arrives 🙃" },
  ];

  /* ─── Typewriter ─── */
  function typewrite(el, text, speed, cb) {
    let i = 0;
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    el.appendChild(cursor);
    const t = setInterval(() => {
      cursor.before(document.createTextNode(text[i]));
      i++;
      if (i >= text.length) {
        clearInterval(t);
        setTimeout(() => { cursor.remove(); if (cb) cb(); }, 600);
      }
    }, speed);
  }

  /* ─── Boot sequence ─── */
  window.addEventListener('DOMContentLoaded', () => {
    const main  = document.getElementById('greeting-main');
    const sub   = document.getElementById('greeting-sub');
    const tease = document.getElementById('greeting-tease');

    // Step 1: typewrite greeting
    setTimeout(() => {
      typewrite(main, `Good morning, ${name} ❤️`, 55, () => {
        // Step 2: fade in sub
        setTimeout(() => {
          sub.textContent = "My bebe… my Amor… Queen of my heart 👑";
          sub.style.opacity = '1';
          // Step 3: fade in tease
          setTimeout(() => {
            tease.textContent = "Did you miss me… or should I ask again at your earliest convenience? 😌";
            tease.style.opacity = '1';
          }, 900);
        }, 400);
      });
    }, 700);

    // Surprise card after 9 seconds
    setTimeout(() => {
      const sc = document.getElementById('surprise-card');
      sc.classList.add('visible');
    }, 9000);
  });

  /* ─── Button Handlers ─── */
  function showResponse(emoji, text) {
    const card = document.getElementById('response-card');
    const emojiEl = document.getElementById('response-emoji');
    const textEl  = document.getElementById('response-text');
    emojiEl.textContent = emoji;
    textEl.textContent  = text;
    card.classList.remove('visible');
    card.style.display = 'none';
    void card.offsetWidth; // reflow
    card.classList.add('visible');
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function handleYes() {
    const r = yesResponses[Math.floor(Math.random() * yesResponses.length)];
    showResponse(r.emoji, r.text);
    document.body.classList.remove('glow');
    void document.body.offsetWidth;
    document.body.classList.add('glow');
    burstHearts(12);
    // Show surprise early if not already shown
    const sc = document.getElementById('surprise-card');
    sc.classList.add('visible');
  }

  function handleWait() {
    const r = waitResponses[Math.floor(Math.random() * waitResponses.length)];
    showResponse(r.emoji, r.text);
  }

  /* ─── Music ─── */
  const audio = document.getElementById('bg-music');
  const musicBtn = document.getElementById('music-btn');
  let playing = false;

  // Try autoplay
  window.addEventListener('DOMContentLoaded', () => {
    audio.volume = 0.45;
    const promise = audio.play();
    if (promise !== undefined) {
      promise.then(() => {
        playing = true;
        musicBtn.textContent = '🎵 Playing: LOVE. – Kendrick';
        musicBtn.classList.add('playing');
      }).catch(() => {
        // Autoplay blocked — user sees the button
      });
    }
  });

  function toggleMusic() {
    if (playing) {
      audio.pause();
      playing = false;
      musicBtn.textContent = '🎵 Tap to play music';
      musicBtn.classList.remove('playing');
    } else {
      audio.play();
      playing = true;
      musicBtn.textContent = '🎵 Playing: LOVE. – Kendrick';
      musicBtn.classList.add('playing');
    }
  }

  /* ─── Floating Hearts Canvas ─── */
  const canvas = document.getElementById('hearts-canvas');
  const ctx = canvas.getContext('2d');
  let hearts = [];

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function Heart(x, y, burst) {
    this.x    = x || Math.random() * canvas.width;
    this.y    = y || canvas.height + 20;
    this.size = burst
      ? 14 + Math.random() * 20
      : 8 + Math.random() * 14;
    this.speedY = burst ? -(3 + Math.random() * 4) : -(0.5 + Math.random() * 1.2);
    this.speedX = (Math.random() - 0.5) * (burst ? 4 : 1.2);
    this.alpha  = burst ? 0.9 : 0.55 + Math.random() * 0.35;
    this.fade   = burst ? 0.018 : 0.004;
    this.color  = burst
      ? `hsl(${330 + Math.random() * 30}, 90%, ${55 + Math.random() * 20}%)`
      : `hsl(${330 + Math.random() * 20}, 80%, ${68 + Math.random() * 14}%)`;
  }

  function drawHeart(x, y, size, alpha, color) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle   = color;
    ctx.beginPath();
    ctx.translate(x, y);
    ctx.scale(size / 10, size / 10);
    ctx.moveTo(0, -3);
    ctx.bezierCurveTo(0, -6, -4.5, -6, -4.5, -2);
    ctx.bezierCurveTo(-4.5, 1, 0, 4, 0, 6);
    ctx.bezierCurveTo(0, 4, 4.5, 1, 4.5, -2);
    ctx.bezierCurveTo(4.5, -6, 0, -6, 0, -3);
    ctx.fill();
    ctx.restore();
  }

  function burstHearts(count) {
    const cx = canvas.width / 2;
    const cy = canvas.height * 0.5;
    for (let i = 0; i < count; i++) {
      hearts.push(new Heart(cx + (Math.random() - 0.5) * 100, cy, true));
    }
  }

  // Spawn ambient hearts
  setInterval(() => {
    if (hearts.length < 28) hearts.push(new Heart());
  }, 900);

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    hearts = hearts.filter(h => h.alpha > 0.01);
    hearts.forEach(h => {
      drawHeart(h.x, h.y, h.size, h.alpha, h.color);
      h.y     += h.speedY;
      h.x     += h.speedX;
      h.alpha -= h.fade;
    });
    requestAnimationFrame(animate);
  }
  animate();
</script>
